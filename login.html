<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Smart Kantin & Koperasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #ecfdf5 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="bg-white shadow-2xl rounded-3xl p-8 border border-slate-200">
      <!-- Logo & Title -->
      <div class="text-center mb-8">
        <div class="mx-auto w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-white text-2xl font-bold shadow-lg mb-4">SK</div>
        <h1 class="text-3xl font-bold bg-gradient-to-r from-emerald-600 to-emerald-500 bg-clip-text text-transparent">Smart Kantin & Koperasi</h1>
        <p class="text-sm text-slate-600 mt-2 font-semibold">🔐 Masuk sebagai Admin atau User</p>
      </div>

      <!-- Form -->
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Peran</label>
          <select id="role" required class="w-full px-5 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-slate-800 bg-white">
            <option value="admin">Admin</option>
            <option value="user">User</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Username</label>
          <input id="username" type="text" placeholder="Masukkan username" required
            class="w-full px-5 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-slate-800" />
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
          <input id="password" type="password" placeholder="Masukkan password" required
            class="w-full px-5 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-slate-800" />
        </div>
        
        <!-- Error Message -->
        <p id="loginError" class="hidden text-sm text-red-600 font-semibold bg-red-50 px-4 py-3 rounded-lg border border-red-200"></p>
        
        <!-- Submit Button -->
        <button type="submit"
          class="w-full py-3.5 rounded-lg bg-gradient-to-r from-emerald-500 to-emerald-600 hover:shadow-lg text-white font-bold shadow-md transition-all hover:-translate-y-0.5 uppercase tracking-wide">
          Masuk
        </button>
        
        <!-- Credentials Hint -->
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 text-xs text-slate-600 text-center">
          <p class="font-semibold text-slate-700 mb-2">🔐 Demo Login</p>
          <p>Admin — Username: <b>admin</b>, Password: <b>admin123</b></p>
          <p>User — Username: <b>user</b>, Password: <b>user123</b></p>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <p class="text-center text-sm text-slate-500 mt-6">Smart Kantin & Koperasi © 2026</p>
  </div>

  <script src="./script.js"></script>
  <script>initLogin();</script>
</body>
</html>
